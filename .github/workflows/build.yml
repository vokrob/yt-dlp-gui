name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            pyinstaller-os: Windows
            archive-suffix: windows-amd64
            exe-name: yt-dlp-gui.exe
          - os: macos-latest
            pyinstaller-os: Darwin
            archive-suffix: macos-amd64
            exe-name: yt-dlp-gui
          - os: ubuntu-latest
            pyinstaller-os: Linux
            archive-suffix: linux-amd64
            exe-name: yt-dlp-gui

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build executable
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-${{ matrix.archive-suffix }}
          path: dist/${{ matrix.exe-name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release archive
        shell: bash
        run: |
          mkdir release
          for dir in yt-dlp-gui-*; do
            if [ -f "$dir/yt-dlp-gui.exe" ]; then
              (cd "$dir" && zip -9 "../release/$dir.zip" "yt-dlp-gui.exe")
            elif [ -f "$dir/yt-dlp-gui" ]; then
              (cd "$dir" && tar czf "../release/$dir.tar.gz" "yt-dlp-gui")
            fi
          done
          echo "=== Release files ==="
          ls -lh release/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
