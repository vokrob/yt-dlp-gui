name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: |
          VERSION: yyyy.mm.dd[.rev]
          (required)
        required: true
        type: string
      prerelease:
        description: Pre-release
        default: false
        type: boolean

permissions: {}

env:
  GH_TELEMETRY: "false"

jobs:
  prepare:
    name: Prepare
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setup_variables.outputs.version }}
      head_sha: ${{ steps.get_target.outputs.head_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup variables
        id: setup_variables
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python devscripts/update-version.py "${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python devscripts/update_changelog.py -vv "${VERSION}"

      - name: Push release commit
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_EVENT_SENDER_LOGIN: ${{ github.event.sender.login }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u CHANGELOG.md
          git commit -m "Release ${VERSION}" \
            -m "Created by: ${GITHUB_EVENT_SENDER_LOGIN}" -m ":ci skip all"
          git push origin "${GITHUB_REF}"

      - name: Push version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin "v${VERSION}"

      - name: Get target commitish
        id: get_target
        run: |
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [prepare]
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build executable
        run: python build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-bin-windows
          path: dist/yt-dlp-gui.exe
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@v8
        with:
          path: artifact
          pattern: build-*
          merge-multiple: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Make SHA2-SUMS files
        shell: bash
        run: |
          cd ./artifact/
          # make sure SHA sums are also printed to stdout
          sha256sum -- * | tee ../SHA2-256SUMS
          sha512sum -- * | tee ../SHA2-512SUMS
          # also print as permanent annotations to the summary page
          while read -r shasum; do
            echo "::notice title=${shasum##* }::sha256: ${shasum% *}"
          done < ../SHA2-256SUMS

      - name: Generate release notes
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          printf '%s' \
            "[![Documentation](https://img.shields.io/badge/-Docs-brightgreen.svg?style=for-the-badge&logo=GitBook&labelColor=555555)]" \
              "(https://github.com/${REPOSITORY}#readme \"Documentation\")" > ./RELEASE_NOTES
          printf '\n\n%s\n\n---\n' \
            "#### Check the [SHA2-256SUMS](https://github.com/${REPOSITORY}/releases/download/v${VERSION}/SHA2-256SUMS) file to verify the integrity of the release files" >> ./RELEASE_NOTES
          python ./devscripts/make_changelog.py -vv --collapsible >> ./RELEASE_NOTES
          printf '%s\n\n' '**This is a pre-release build**' >> ./PRERELEASE_NOTES
          cat ./RELEASE_NOTES >> ./PRERELEASE_NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ inputs.prerelease && 'PRERELEASE_NOTES' || 'RELEASE_NOTES' }}
          PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
        run: |
          gh_options=(
            --notes-file "${NOTES_FILE}"
            --verify-tag
            --title "yt-dlp-gui v${VERSION}"
          )
          if ((PRERELEASE)); then
            gh_options+=(--prerelease)
          fi
          gh release create "${gh_options[@]}" "v${VERSION}" artifact/*
